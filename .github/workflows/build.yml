name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "PyInstaller==6.11.1"

      - name: Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests

      - name: Build Whisper with Vulkan
        continue-on-error: true
        shell: pwsh
        run: |
          choco install vulkan-sdk -y --no-progress
          $sdk = (Get-ChildItem "C:\VulkanSDK" -Directory | Sort-Object Name -Descending | Select-Object -First 1).FullName
          $env:VULKAN_SDK = $sdk
          $env:Path = "$sdk\Bin;$env:Path"
          git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp whisper-src
          cmake -S whisper-src -B whisper-build -DGGML_VULKAN=1 -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build whisper-build --config Release --target whisper-server -j 4
          New-Item -ItemType Directory -Force vendor/whisper | Out-Null
          $exe = Get-ChildItem whisper-build -Recurse -Filter whisper-server.exe | Select-Object -First 1
          Copy-Item $exe.FullName vendor/whisper/whisper-server.exe

      - name: Verify spec
        shell: pwsh
        run: if (-not (Test-Path halcyon.spec)) { exit 1 }

      - name: Build exe
        shell: pwsh
        run: pyinstaller halcyon.spec --noconfirm --distpath dist --workpath build

      - name: Smoke test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath dist/Halcyon.exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "selftest hung"; exit 1 }
          if ($p.ExitCode -ne 0) { Write-Error "selftest exit $($p.ExitCode)"; exit 1 }

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/halcyon/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "v=$v" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Halcyon
          path: dist/Halcyon.exe

    outputs:
      version: ${{ steps.ver.outputs.v }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Halcyon
          path: out
      - uses: ncipollo/release-action@v1
        with:
          artifacts: out/Halcyon.exe
          tag: v${{ needs.build.outputs.version }}
          name: Halcyon ${{ needs.build.outputs.version }}
          commit: ${{ github.sha }}
          allowUpdates: true
          replacesArtifacts: true
          generateReleaseNotes: true
